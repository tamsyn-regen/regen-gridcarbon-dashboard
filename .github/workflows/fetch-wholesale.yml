name: Fetch Wholesale Prices (DAP - Day Ahead)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug DAP endpoint structure
        run: |
          echo "=== Testing DAP endpoint ==="
          curl -s "https://data.elexon.co.uk/bmrs/api/v1/datasets/DAP?from=2026-06-01T00:00Z&to=2026-06-02T00:00Z&format=json" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('TOP LEVEL KEYS:', list(d.keys()))
          data = d.get('data', [])
          print('RECORD COUNT:', len(data))
          if data:
              print('FIRST RECORD:', json.dumps(data[0], indent=2))
              print('SECOND RECORD:', json.dumps(data[1], indent=2))
          else:
              print('NO DATA - full response:')
              print(json.dumps(d, indent=2)[:1000])
          "
          echo "=== End DAP debug ==="

      - name: Fetch DAP day-ahead prices in 7-day chunks
        run: |
          python3 - << 'PYEOF2'
          import json, time, sys
          from datetime import datetime, timedelta, timezone
          from collections import defaultdict
          import urllib.request as urllib2

          def fetch_chunk(from_dt, to_dt):
              from_str = from_dt.strftime("%Y-%m-%dT%H:%MZ")
              to_str   = to_dt.strftime("%Y-%m-%dT%H:%MZ")
              url = (
                  "https://data.elexon.co.uk/bmrs/api/v1/datasets/DAP"
                  f"?from={from_str}&to={to_str}&format=json"
              )
              print(f"  Fetching {from_str} -> {to_str} ...", flush=True)
              try:
                  req = urllib2.Request(url, headers={"Accept": "application/json"})
                  with urllib2.urlopen(req, timeout=30) as resp:
                      if resp.status != 200:
                          print(f"  HTTP {resp.status} - skipping")
                          return []
                      data = json.loads(resp.read().decode())
                      records = data.get("data", [])
                      print(f"  Got {len(records)} records")
                      return records
              except Exception as e:
                  print(f"  Error: {e} - skipping chunk")
                  return []

          now = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
          all_records = []
          chunk_days = 7
          total_days = 365
          chunks = total_days // chunk_days

          for i in range(chunks):
              to_dt   = now - timedelta(days=i * chunk_days)
              from_dt = now - timedelta(days=(i + 1) * chunk_days)
              records = fetch_chunk(from_dt, to_dt)
              all_records.extend(records)
              time.sleep(0.3)

          print(f"Total raw records: {len(all_records)}")
          if not all_records:
              print("No records — keeping existing wholesale.json")
              sys.exit(0)

          # Print a sample record so we can verify the field names
          print("SAMPLE RECORD:", json.dumps(all_records[0], indent=2))

          # Group by startTime, extract price field
          # DAP field names — we try both 'price' and 'marketIndexPrice' in case
          by_slot = defaultdict(list)
          for row in all_records:
              # Try the field names we know from the debug step
              price = row.get("price") or row.get("marketIndexPrice") or row.get("dayAheadPrice")
              start = row.get("startTime") or row.get("settlementDate")
              if price is not None and start is not None:
                  by_slot[start].append(float(price))

          print(f"Unique slots after grouping: {len(by_slot)}")

          output = [
              {
                  "startTime": k,
                  "price_pence": round(sum(v) / len(v) / 10, 4)  # £/MWh -> p/kWh
              }
              for k, v in sorted(by_slot.items())
          ]

          print(f"Processed slots: {len(output)}")
          if output:
              print(f"Date range: {output[0]['startTime']} -> {output[-1]['startTime']}")
              print(f"Sample price: {output[0]['price_pence']} p/kWh")

          result = {
              "fetched_at": datetime.now(timezone.utc).isoformat(),
              "record_count": len(output),
              "unit": "p/kWh",
              "source": "Elexon BMRS Day-Ahead Price (DAP) - converted from GBP/MWh",
              "data": output
          }

          with open("wholesale.json", "w") as f:
              json.dump(result, f, separators=(",", ":"))

          print(f"Written wholesale.json with {len(output)} slots")
          PYEOF2

      - name: Commit wholesale.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wholesale.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update day-ahead wholesale prices [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
