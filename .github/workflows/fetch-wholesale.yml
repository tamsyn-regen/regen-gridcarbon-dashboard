name: Fetch Wholesale Prices

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # manual trigger from Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch 6 days of Elexon wholesale data
        run: |
          # can only filter 6 days because 7 is the max
          FROM=$(date -u -d '6 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          TO=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "Fetching from $FROM to $TO"

          HTTP_STATUS=$(curl -s \
            -o raw_wholesale.json \
            -w "%{http_code}" \
            "https://data.elexon.co.uk/bmrs/api/v1/balancing/pricing/market-index?from=${FROM}&to=${TO}&format=json")
          
          echo "HTTP status: $HTTP_STATUS"

          python3 - << 'PYEOF'
          import json
          
          with open('raw_wholesale.json') as f:
              d = json.load(f)
          
          print("TOP LEVEL KEYS:")
          print(list(d.keys()))
          
          if 'data' in d:
              print("DATA LENGTH:", len(d['data']))
              if len(d['data']) > 0:
                  print("FIRST RECORD:")
                  print(d['data'][0])
          else:
              print("NO 'data' FIELD FOUND")
              print(d)
          PYEOF

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "API returned $HTTP_STATUS — aborting"
            exit 1
          fi

          # Check we got actual data
          RECORD_COUNT=$(python3 -c "import json,sys; d=json.load(open('raw_wholesale.json')); print(len(d.get('data',[])))" 2>/dev/null || echo "0")
          echo "Records fetched: $RECORD_COUNT"

          if [ "$RECORD_COUNT" = "0" ]; then
            echo "No records returned — aborting to preserve existing file"
            exit 0
          fi

          # Process: average across data providers per settlement period,
          # convert £/MWh → p/kWh (÷10), output clean array
          python3 << 'PYEOF'
          import json, sys
          from collections import defaultdict
          
          with open('raw_wholesale.json') as f:
              raw = json.load(f)
          
          data = raw.get('data', [])
          
          # Group by startTime, average marketIndexPrice across providers
          by_slot = defaultdict(list)
          for row in data:
              price = row.get('marketIndexPrice')
              start = row.get('startTime')
              if price is not None and start is not None:
                  by_slot[start].append(float(price))
          
          # Build output list sorted by time, price in p/kWh
          output = []
          for start_time, prices in sorted(by_slot.items()):
              avg_mwh = sum(prices) / len(prices)
              output.append({
                  "startTime": start_time,
                  "price_pence": round(avg_mwh / 10, 4)   # £/MWh → p/kWh
              })
          
          result = {
              "fetched_at": __import__('datetime').datetime.utcnow().isoformat() + 'Z',
              "record_count": len(output),
              "unit": "p/kWh",
              "source": "Elexon BMRS Market Index Price (avg across providers, converted from £/MWh)",
              "data": output
          }
          
          with open('wholesale.json', 'w') as f:
              json.dump(result, f, separators=(',', ':'))
          
          print(f"Written {len(output)} slots to wholesale.json")
          PYEOF

      - name: Commit wholesale.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add wholesale.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update wholesale prices"

            git pull --rebase origin main
            git push origin main
          fi
