name: Fetch Wholesale Prices

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Elexon wholesale data in 7-day chunks
        run: |
          python3 - << 'PYEOF2'
          import json, time
          from datetime import datetime, timedelta, timezone
          from collections import defaultdict
          import urllib.request as urllib2

          def fetch_chunk(from_dt, to_dt):
              # Format exactly as the API expects: 2022-06-01T00:00Z
              from_str = from_dt.strftime("%Y-%m-%dT%H:%MZ")
              to_str   = to_dt.strftime("%Y-%m-%dT%H:%MZ")
              url = (
                  "https://data.elexon.co.uk/bmrs/api/v1/balancing/pricing/market-index"
                  f"?from={from_str}&to={to_str}&format=json"
              )
              print(f"  Fetching {from_str} -> {to_str} ...", flush=True)
              try:
                  req = urllib2.Request(url, headers={"Accept": "application/json"})
                  with urllib2.urlopen(req, timeout=30) as resp:
                      if resp.status != 200:
                          print(f"  HTTP {resp.status} - skipping")
                          return []
                      data = json.loads(resp.read().decode())
                      records = data.get("data", [])
                      print(f"  Got {len(records)} records")
                      return records
              except Exception as e:
                  print(f"  Error: {e} - skipping chunk")
                  return []

          now = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
          all_records = []
          chunk_days = 7
          total_days = 365
          chunks = total_days // chunk_days  # 52 chunks

          for i in range(chunks):
              to_dt   = now - timedelta(days=i * chunk_days)
              from_dt = now - timedelta(days=(i + 1) * chunk_days)
              records = fetch_chunk(from_dt, to_dt)
              all_records.extend(records)
              time.sleep(0.3)

          print(f"Total raw records: {len(all_records)}")

          by_slot = defaultdict(list)
          for row in all_records:
              price = row.get("marketIndexPrice")
              start = row.get("startTime")
              if price is not None and start is not None:
                  by_slot[start].append(float(price))

          output = [
              {
                  "startTime": k,
                  "price_pence": round(sum(v) / len(v) / 10, 4)
              }
              for k, v in sorted(by_slot.items())
          ]

          print(f"Processed slots: {len(output)}")
          if output:
              print(f"Date range: {output[0]['startTime']} -> {output[-1]['startTime']}")

          result = {
              "fetched_at": datetime.now(timezone.utc).isoformat(),
              "record_count": len(output),
              "unit": "p/kWh",
              "source": "Elexon BMRS Market Index Price (avg across providers, converted from GBP/MWh)",
              "data": output
          }

          with open("wholesale.json", "w") as f:
              json.dump(result, f, separators=(",", ":"))

          print(f"Written wholesale.json with {len(output)} slots")
          PYEOF2

      - name: Commit wholesale.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wholesale.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update wholesale prices [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
